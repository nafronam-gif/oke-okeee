<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Setup Database JOKIPLACE</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
    body { font-family: 'Inter', sans-serif; background: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .box { background: #fff; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; max-width: 400px; }
    h1 { color: #1a1f36; margin-bottom: 10px; }
    p { color: #6b7280; margin-bottom: 24px; font-size: 14px; }
    button { background: #2563eb; color: #fff; border: none; padding: 14px 24px; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; width: 100%; transition: 0.2s; }
    button:hover { background: #1d4ed8; }
    .success { color: #16a34a; font-weight: bold; margin-top: 20px; display: none; }
</style>
</head>
<body>
<div class="box">

</div>

        email: "nafronabdi@gmail.com",
