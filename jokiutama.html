<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JOKIPLACE - Pilih Layanan Joki</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/css/style.css">
<style>
    .hero-title { font-size: 36px; font-weight: 900; text-align: center; margin-top: 40px; margin-bottom: 8px; }
    .hero-subtitle { font-size: 15px; color: var(--muted); text-align: center; margin-bottom: 40px; }
    .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; max-width: 900px; margin: 0 auto; }
    .menu-card { background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 40px 30px; text-align: center; text-decoration: none; color: inherit; transition: all 0.3s; box-shadow: 0 10px 30px rgba(0,0,0,0.03); }
    .menu-card:hover { transform: translateY(-5px); box-shadow: 0 15px 40px rgba(15,108,255,0.1); border-color: var(--blue); }
    .menu-icon { font-size: 48px; margin-bottom: 16px; }
    .menu-title { font-size: 22px; font-weight: 900; color: var(--text); margin-bottom: 8px; }
    .menu-desc { font-size: 14px; color: var(--muted); line-height: 1.6; }
</style>
</head>
<body>
<div id="tsparticles" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none;"></div>
<div class="layout" style="position: relative; z-index: 1;">
<header class="header">
    <a class="logo" href="index.html">JOKIPLACE</a>

</header>

<div class="content">
    <h1 class="hero-title">Pilih Layanan Joki</h1>
    <p class="hero-subtitle">Silakan pilih mode rank yang ingin kamu naikkan.</p>

    <div class="menu-grid">
        <a href="br.html" class="menu-card">
            <div class="menu-icon">🎯</div>
            <div class="menu-title">BR Rank</div>
            <div class="menu-desc">Push rank Battle Royale. Cocok untuk menaikkan tier Heroic sampai Master.</div>
        </a>
        
        <a href="cs.html" class="menu-card">
            <div class="menu-icon">⚔️</div>
            <div class="menu-title">CS Rank</div>
            <div class="menu-desc">Push rank Clash Squad. Hitung biaya joki berdasarkan jumlah bintang.</div>
        </a>
    </div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tsparticles@2.12.0/tsparticles.bundle.min.js"></script>
<script>
    if (typeof tsParticles !== 'undefined') {
        tsParticles.load("tsparticles", {
            fpsLimit: 60, particles: { color: { value: "#0f6cff" }, links: { color: "#0f6cff", distance: 150, enable: true, opacity: 0.2, width: 1 }, move: { enable: true, speed: 1 }, number: { value: 60 }, size: { value: { min: 1, max: 4 } } }
        });
    }
</script>
</body>
</html>
