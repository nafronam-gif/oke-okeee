<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JOKIPLACE - Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/css/style.css">
<style>
.login-container{max-width:420px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:32px;box-shadow:0 8px 30px rgba(15,108,255,.08)}
.alert{display:none;padding:12px 16px;border-radius:10px;font-size:13px;font-weight:600;margin-bottom:20px;align-items:flex-start;gap:10px;animation:slideDown .3s ease}
.alert.show{display:flex}
.alert-error{background:#fef2f2;color:#991b1b;border:1px solid #fecaca}
.alert-success{background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.input-error{border-color:#ef4444!important;background:#fef2f2!important}
</style>
</head>
<body>
<div class="layout">
<header class="header">
<a class="logo" href="index.html">JOKIPLACE</a>
<div style="margin-left:auto;display:flex;gap:12px">
<a href="index.html" class="btn btn-outline">Beranda</a>
</div>
</header>
<div class="content">
<div class="login-container">
<h1 style="font-size:24px;font-weight:900;margin-bottom:8px;text-align:center">Login</h1>
<p style="font-size:13px;color:var(--muted);text-align:center;margin-bottom:24px">Masuk pakai Gmail dan password kamu.</p>
<div id="alertBox" class="alert alert-error">
  <span id="alertMsg">Pesan error</span>
</div>
<form id="loginForm" onsubmit="submitLogin(event)" novalidate>
<div class="calc-group" style="margin-bottom:16px">
<label>Email Gmail</label>
<input type="email" id="loginEmail" placeholder="nama@gmail.com">
</div>
<div class="calc-group" style="margin-bottom:24px">
<label>Password</label>
<input type="password" id="loginPassword" placeholder="Masukkan password">
</div>
<button type="submit" class="btn btn-primary" id="btnSubmit" style="width:100%;padding:14px">Masuk</button>
</form>
<div style="text-align:center;margin-top:16px">
<p style="font-size:13px;color:var(--muted)">Belum punya akun? <a href="register.html" style="color:var(--blue);font-weight:700">Daftar</a></p>
<a href="index.html" style="font-size:13px;color:var(--muted);display:inline-block;margin-top:8px">&larr; Kembali ke Beranda</a>
</div>
</div>
</div>
</div>

<!-- Tambahkan Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
const KEY_USER  = "jp_user";
const ADMIN_EMAIL = "nafronabdi@gmail.com";

function showAlert(msg, type = "error") {
  const box = document.getElementById("alertBox");
  document.getElementById("alertMsg").textContent = msg;
  box.className = "alert show alert-" + type;
  setTimeout(() => { box.className = "alert"; }, 4000);
}

async function submitLogin(e) {
  e.preventDefault();
  const email = document.getElementById("loginEmail").value.trim().toLowerCase();
  const password = document.getElementById("loginPassword").value;
  const btnSubmit = document.getElementById("btnSubmit");

  if (!email) { showAlert("Email wajib diisi."); return; }
  if (!password) { showAlert("Password wajib diisi."); return; }
  if (!email.endsWith("@gmail.com")) { showAlert("Email harus @gmail.com"); return; }

  // Tampilkan loading
  btnSubmit.textContent = "Memproses...";
  btnSubmit.disabled = true;

  try {
    // 1. Login via Firebase Authentication
    const userCredential = await auth.signInWithEmailAndPassword(email, password);
    const user = userCredential.user;

    // 2. Ambil data role/nama dari Firestore (BUKAN localStorage)
    const userDoc = await db.collection("users").doc(user.uid).get();
    
    let userData = {
        id: user.uid,
        email: user.email,
        nama: "User",
        role: "client",
        penjokiNama: ""
    };

    if (userDoc.exists) {
        userData = { ...userData, ...userDoc.data() };
    } else if (email === ADMIN_EMAIL) {
        // Jika Admin belum punya dokumen di Firestore, buatkan otomatis
        userData.nama = "Admin";
        userData.role = "admin";
        await db.collection("users").doc(user.uid).set(userData);
    }

    // 3. Simpan sesi login (hanya untuk navigasi UI, bukan database utama)
    localStorage.setItem(KEY_USER, JSON.stringify(userData));

    showAlert("Login berhasil! Mengalihkan...", "success");
    
    setTimeout(() => {
      if (userData.role === "admin") window.location.href = "dashboard-admin.html";
      else if (userData.role === "penjoki") window.location.href = "dashboard-penjoki.html";
      else window.location.href = "client.html";
    }, 900);

  } catch (error) {
    console.error("Login Error:", error);
    btnSubmit.textContent = "Masuk";
    btnSubmit.disabled = false;

    // Terjemahan error Firebase ke bahasa Indonesia
    if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
      showAlert("Email atau password salah.");
    } else if (error.code === 'auth/too-many-requests') {
      showAlert("Terlalu banyak percobaan login. Coba lagi nanti.");
    } else {
      showAlert("Gagal login: " + error.message);
    }
  }
}
</script>
</body>
</html>
